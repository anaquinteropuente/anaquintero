<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ana Quintero · Sin señal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6E1E3B">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
  :root{--rose:#EAB0C8;--plum:#6E1E3B;--lime:#C9D863;--ivory:#F7F6D7;
    --title:"Bricolage Grotesque","Helvetica Neue",Helvetica,Arial,sans-serif;--font:"Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--plum);color:var(--rose);font-family:var(--font);-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  .msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none;z-index:2}
  .k{margin:0 0 16px;font:600 13px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
  h1{margin:0;font:800 clamp(46px,11vw,190px)/.86 var(--title);letter-spacing:-.05em;text-transform:uppercase;text-shadow:0 6px 30px rgba(40,8,22,.35)}
  p.sub{margin:18px 0 0;font-size:clamp(16px,1.6vw,20px);color:var(--ivory);opacity:.85}
  .btn{pointer-events:auto;margin-top:26px;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:99px;border:0;cursor:pointer;
    background:var(--lime);color:var(--plum);font:700 15px/1 var(--font);text-decoration:none;box-shadow:0 12px 30px -10px rgba(20,4,10,.6)}
  .btn:hover{background:var(--rose)}
  .tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;font:500 13px/1 var(--font);color:var(--rose);opacity:.6;z-index:2;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="msg">
  <p class="k" id="k">Error 404</p>
  <h1 id="t">Sin señal</h1>
  <p class="sub" id="s">Esta página no existe.</p>
  <a class="btn" id="b" href="/">Volver al inicio</a>
</div>
<p class="tip" id="tip">Coge un móvil y lánzalo</p>
<script>
(function(){
  'use strict';
  // ---------- textos (ES / EN, y sin conexión / 404) ----------
  var en = false; try { en = localStorage.getItem('aq-lang') === 'en'; } catch (e) {}
  if (!en && !/^es\b/i.test(navigator.language || 'es')) en = /^en\b/i.test(navigator.language || '');
  var offline = navigator.onLine === false;
  var T = offline
    ? (en ? ['No connection', 'No signal', 'You seem to be offline. Try again in a moment.', 'Try again']
          : ['Sin conexión', 'Sin señal', 'Parece que no tienes internet. Prueba otra vez en un momento.', 'Reintentar'])
    : (en ? ['Error 404', 'No signal', 'This page doesn’t exist.', 'Back to home']
          : ['Error 404', 'Sin señal', 'Esta página no existe.', 'Volver al inicio']);
  document.documentElement.lang = en ? 'en' : 'es';
  document.getElementById('k').textContent = T[0];
  document.getElementById('t').textContent = T[1];
  document.getElementById('s').textContent = T[2];
  var b = document.getElementById('b'); b.textContent = T[3];
  if (offline) { b.href = '#'; b.addEventListener('click', function (e) { e.preventDefault(); location.reload(); }); }
  document.getElementById('tip').textContent = en ? 'Grab a phone and throw it' : 'Coge un móvil y lánzalo';
  addEventListener('online', function () { if (offline) location.reload(); });

  // ---------- móviles con física sencilla ----------
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var W, H, DPR, S, phones = [], drag = null;
  var COLORS = [
    ['#EAB0C8', '#D996B3'], ['#C9D863', '#AEBE48'], ['#F7F6D7', '#DCDAB6'], ['#E0503E', '#B83A2B'],
    ['#9B3A5F', '#7A2848'], ['#8FB3E8', '#6E92C8'], ['#F2A24A', '#D3832C'], ['#3F0F23', '#2A0816']
  ];
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.max(34, Math.min(64, Math.min(W, H) / 12));   // ancho de un móvil
  }
  resize(); addEventListener('resize', resize);
  var MAX = W < 700 ? 34 : 70, spawned = 0;
  function spawn() {
    if (spawned >= MAX) return;
    var s = S * (0.8 + Math.random() * 0.45);
    phones.push({ x: W * (0.06 + Math.random() * 0.88), y: -s * 2 - Math.random() * 60, vx: (Math.random() - .5) * 2, vy: Math.random() * 2,
      a: (Math.random() - .5) * 1.4, va: (Math.random() - .5) * .08, w: s, h: s * 2.05, r: s * 0.86, c: COLORS[spawned % COLORS.length] });
    spawned++;
  }
  var spawnT = setInterval(function () { spawn(); if (spawned >= MAX) clearInterval(spawnT); }, reduce ? 0 : 110);

  // dibujo del móvil antiguo
  function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
  function draw(p) {
    var w = p.w, h = p.h;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a);
    cx.shadowColor = 'rgba(20,4,10,.45)'; cx.shadowBlur = w * .35; cx.shadowOffsetY = w * .12;
    rr(-w / 2, -h / 2, w, h, w * .42); cx.fillStyle = p.c[0]; cx.fill();
    cx.shadowColor = 'transparent';
    // canto
    rr(-w / 2, -h / 2, w, h, w * .42); cx.lineWidth = w * .06; cx.strokeStyle = p.c[1]; cx.stroke();
    // brillo
    rr(-w / 2 + w * .1, -h / 2 + w * .08, w * .22, h * .5, w * .1); cx.fillStyle = 'rgba(255,255,255,.18)'; cx.fill();
    // pantalla
    rr(-w * .34, -h * .34, w * .68, h * .27, w * .08); cx.fillStyle = '#2b0a18'; cx.fill();
    rr(-w * .28, -h * .31, w * .56, h * .21, w * .04); cx.fillStyle = '#C9D863'; cx.fill();
    cx.fillStyle = 'rgba(46,42,12,.75)'; cx.fillRect(-w * .2, -h * .25, w * .4, h * .025); cx.fillRect(-w * .2, -h * .2, w * .26, h * .025);
    // botón central
    rr(-w * .22, -h * .03, w * .44, h * .07, w * .1); cx.fillStyle = p.c[1]; cx.fill();
    // teclado
    cx.fillStyle = p.c[1];
    for (var r = 0; r < 4; r++) for (var k = 0; k < 3; k++) {
      cx.beginPath(); cx.ellipse(-w * .24 + k * w * .24, h * .09 + r * h * .075, w * .085, h * .024, 0, 0, Math.PI * 2); cx.fill();
    }
    cx.restore();
  }

  // sonido de tecla al chocar fuerte (tras el primer toque)
  var ac = null, lastBeep = 0;
  function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
  function beep(v) {
    if (!ac || performance.now() - lastBeep < 70) return; lastBeep = performance.now();
    var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'square'; o.frequency.value = 900 + Math.random() * 900;
    g.gain.setValueAtTime(Math.min(.04, v * .006), t); g.gain.exponentialRampToValueAtTime(.0001, t + .07);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .08);
  }

  function step() {
    var G = .45, n = phones.length, i, j, p, q;
    for (i = 0; i < n; i++) {
      p = phones[i];
      if (p === (drag && drag.p)) continue;
      p.vy += G; p.vx *= .995; p.vy *= .995; p.va *= .985;
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      // suelo y paredes
      if (p.y > H - p.r) { if (p.vy > 6) beep(p.vy); p.y = H - p.r; p.vy *= -.28; p.vx *= .86; p.va = p.vx / p.r * .5; }
      if (p.x < p.r) { p.x = p.r; p.vx *= -.4; }
      if (p.x > W - p.r) { p.x = W - p.r; p.vx *= -.4; }
    }
    // choques entre móviles (como discos)
    for (var it = 0; it < 3; it++) for (i = 0; i < n; i++) for (j = i + 1; j < n; j++) {
      p = phones[i]; q = phones[j];
      var dx = q.x - p.x, dy = q.y - p.y, R = p.r + q.r, d2 = dx * dx + dy * dy;
      if (d2 >= R * R || d2 === 0) continue;
      var d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (R - d);
      var dp = drag && drag.p === p, dq = drag && drag.p === q;
      var wp = dp ? 0 : dq ? 1 : .5, wq = dq ? 0 : dp ? 1 : .5;
      p.x -= nx * ov * wp; p.y -= ny * ov * wp; q.x += nx * ov * wq; q.y += ny * ov * wq;
      var rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
      if (rv < 0) {
        var jimp = -(1.25) * rv / 2;
        if (!dp) { p.vx -= jimp * nx; p.vy -= jimp * ny; }
        if (!dq) { q.vx += jimp * nx; q.vy += jimp * ny; }
        var tang = (q.vx - p.vx) * -ny + (q.vy - p.vy) * nx;
        if (!dp) p.va -= tang * .004; if (!dq) q.va += tang * .004;
        if (-rv > 7) beep(-rv);
      }
    }
  }
  function frame() {
    step();
    cx.clearRect(0, 0, W, H);
    for (var i = 0; i < phones.length; i++) draw(phones[i]);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // coger y lanzar
  function pick(x, y) {
    for (var i = phones.length - 1; i >= 0; i--) { var p = phones[i], dx = x - p.x, dy = y - p.y; if (dx * dx + dy * dy < p.r * p.r * 1.3) return p; }
    return null;
  }
  cv.addEventListener('pointerdown', function (e) {
    initAudio();
    var p = pick(e.clientX, e.clientY); if (!p) return;
    phones.splice(phones.indexOf(p), 1); phones.push(p);   // al frente
    drag = { p: p, ox: e.clientX - p.x, oy: e.clientY - p.y, lx: e.clientX, ly: e.clientY, vx: 0, vy: 0 };
    cv.setPointerCapture(e.pointerId); cv.classList.add('drag');
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = drag.p; drag.vx = e.clientX - drag.lx; drag.vy = e.clientY - drag.ly; drag.lx = e.clientX; drag.ly = e.clientY;
    p.x = e.clientX - drag.ox; p.y = e.clientY - drag.oy; p.vx = drag.vx; p.vy = drag.vy; p.va = drag.vx * .01;
  });
  function drop() { if (!drag) return; var p = drag.p; p.vx = drag.vx * 1.4; p.vy = drag.vy * 1.4; p.va = drag.vx * .012; drag = null; cv.classList.remove('drag'); }
  cv.addEventListener('pointerup', drop); cv.addEventListener('pointercancel', drop);
})();
</script>
</body>
</html>
